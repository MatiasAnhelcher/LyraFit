<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090C" />
    <meta
      name="description"
      content="Progresiones de calistenia, registro de entrenamientos y temporizador. Funciona sin conexión."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Solo Sora: dibuja la cifra de identidad, lo más grande de Hoy. Sin
         `crossorigin` el navegador la baja dos veces, porque las fuentes se
         piden siempre en modo CORS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fuentes/sora.woff2" />
    <title>LyraFit</title>
    <!-- El movimiento, antes de pintar. La app lee la preferencia de la base,
         que es asíncrona, y para entonces la primera pantalla ya entró: esto
         pone la del teléfono primero, y el portero la corrige con la de
         Ajustes antes de dibujar nada que se mueva. Es el único lugar que
         consulta el media query; deja escrito lo que pide el teléfono en
         `data-movimiento-sistema`, y lo actualiza si cambia con la app
         abierta. Con 2 GB de memoria o menos, los pasajes van livianos. -->
    <script>
      (function () {
        var raiz = document.documentElement
        try {
          var pedido = window.matchMedia('(prefers-reduced-motion: reduce)')
          var seguir = function () {
            raiz.setAttribute('data-movimiento-sistema', pedido.matches ? 'reducido' : 'completo')
          }
          seguir()
          if (pedido.matches) raiz.setAttribute('data-movimiento', 'reducido')
          if (pedido.addEventListener) pedido.addEventListener('change', seguir)
          else if (pedido.addListener) pedido.addListener(seguir)
        } catch (e) {}
        if (navigator.deviceMemory && navigator.deviceMemory <= 2) raiz.setAttribute('data-liviano', '')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
